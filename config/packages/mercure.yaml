mercure:
    enable_profiler: '%kernel.debug%'
    hubs:
        default:
            url: 'http://127.0.0.1:3000/.well-known/mercure'
            public_url: 'http://127.0.0.1:3000/.well-known/mercure'
            jwt:
                secret: '%env(MERCURE_JWT_SECRET)%'
                publish: '*'
